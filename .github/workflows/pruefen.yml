name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  html:
    name: HTML aus dem Quellcode gebaut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: bauen.py ausführen
        working-directory: quellcode
        run: python bauen.py
      - name: Eingecheckte HTML-Datei ist aktuell
        run: git diff --exit-code -- dashboard/Labor-KPI-Dashboard.html || { echo "dashboard/Labor-KPI-Dashboard.html passt nicht zum Quellcode. Bitte quellcode/bauen.py ausführen und die HTML-Datei mit einchecken."; exit 1; }

  portable-bauen:
    name: Offline-Paket bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build_portable.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Labor-KPI-Dashboard-portable
          path: dist/*.zip
          retention-days: 7

  windows-test:
    name: Offline-Paket unter Windows testen
    needs: portable-bauen
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Labor-KPI-Dashboard-portable
      - name: Entpacken
        shell: pwsh
        run: Get-ChildItem *.zip | ForEach-Object { Expand-Archive $_ -DestinationPath . }
      - name: Mitgeliefertes Python liest und schreibt Excel
        shell: cmd
        run: Labor-KPI-Dashboard\python\python.exe -E -s -c "import pandas as pd, openpyxl; pd.DataFrame({'a': [1, 2]}).to_excel('t.xlsx', index=False); assert pd.read_excel('t.xlsx')['a'].sum() == 3; print('pandas', pd.__version__, 'openpyxl', openpyxl.__version__)"
      - name: Aktualisieren.bat nimmt das mitgelieferte Python
        shell: pwsh
        run: |
          $aus = (cmd /c 'echo.| "Labor-KPI-Dashboard\Aktualisieren.bat"' 2>&1) -join "`n"
          Write-Host $aus
          if ($aus -notmatch [regex]::Escape('Labor-KPI-Dashboard\python\python.exe')) { throw "Aktualisieren.bat hat nicht das mitgelieferte Python genommen" }
          if ($aus -notmatch 'Diese Dateien fehlen') { throw "Erwartete Meldung zu fehlenden Excel-Dateien kam nicht" }
          Write-Host "Aktualisieren.bat startet mit dem mitgelieferten Python und meldet die fehlenden Exporte."
      - name: Keine Firmendaten im Paket
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse Labor-KPI-Dashboard -Include *.xlsx,*.xlsm,daten.js,stand.js | Where-Object { $_.FullName -notmatch '\\python\\' }
          if ($f) { $f | ForEach-Object { Write-Host $_.FullName }; throw "Datendateien im Paket gefunden" }
